name: openexpert-local

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-trixie
    environment:
      POSTGRES_DB: ${OPENEXPERT_POSTGRES_DB:-openexpert}
      POSTGRES_PASSWORD: ${OPENEXPERT_POSTGRES_PASSWORD:-openexpert-postgres-local}
      POSTGRES_USER: postgres
      OPENEXPERT_ADMIN_PASSWORD: ${OPENEXPERT_ADMIN_PASSWORD:-openexpert-admin-local}
      OPENEXPERT_AUTH_PASSWORD: ${OPENEXPERT_AUTH_PASSWORD:-openexpert-auth-local}
      OPENEXPERT_AUTHENTICATOR_PASSWORD: ${OPENEXPERT_AUTHENTICATOR_PASSWORD:-openexpert-authenticator-local}
      OPENEXPERT_RUNTIME_PASSWORD: ${OPENEXPERT_RUNTIME_PASSWORD:-openexpert-runtime-local}
    ports:
      - "127.0.0.1:${OPENEXPERT_POSTGRES_PORT:-55322}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v14.16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_DB_EXTRA_SEARCH_PATH: extensions
      PGRST_DB_SCHEMAS: public
      PGRST_DB_URI: postgresql://authenticator@postgres:5432/${OPENEXPERT_POSTGRES_DB:-openexpert}
      PGRST_JWT_AUD: ${NUXT_DATA_API_JWT_AUDIENCE:-openexpert-data}
      PGRST_JWT_SECRET: ${OPENEXPERT_DATA_API_JWKS:?Run db:local:setup to generate local Ed25519 keys}
      PGRST_LOG_LEVEL: warn
      PGRST_SERVER_PORT: 3000
      PGPASSWORD: ${OPENEXPERT_AUTHENTICATOR_PASSWORD:-openexpert-authenticator-local}
    ports:
      - "127.0.0.1:${OPENEXPERT_POSTGREST_PORT:-55321}:3000"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.2
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${OPENEXPERT_MAILPIT_UI_PORT:-55324}:8025"
      - "127.0.0.1:${OPENEXPERT_MAILPIT_SMTP_PORT:-55325}:1025"
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.1
    profiles:
      - livekit
    command:
      - --dev
      - --bind
      - 0.0.0.0
    ports:
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_HTTP_PORT:-7880}:7880"
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    restart: unless-stopped

volumes:
  postgres-data:
    name: openexpert-local-postgres-data
