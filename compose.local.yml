name: openexpert-local

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-trixie
    environment:
      POSTGRES_DB: ${OPENEXPERT_POSTGRES_DB:-openexpert}
      POSTGRES_PASSWORD: ${OPENEXPERT_POSTGRES_PASSWORD:-openexpert-postgres-local}
      POSTGRES_USER: postgres
      OPENEXPERT_ADMIN_PASSWORD: ${OPENEXPERT_ADMIN_PASSWORD:-openexpert-admin-local}
      OPENEXPERT_AUTH_PASSWORD: ${OPENEXPERT_AUTH_PASSWORD:-openexpert-auth-local}
      OPENEXPERT_AUTHENTICATOR_PASSWORD: ${OPENEXPERT_AUTHENTICATOR_PASSWORD:-openexpert-authenticator-local}
      OPENEXPERT_RUNTIME_PASSWORD: ${OPENEXPERT_RUNTIME_PASSWORD:-openexpert-runtime-local}
    ports:
      - "127.0.0.1:${OPENEXPERT_POSTGRES_PORT:-55322}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v14.16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_DB_EXTRA_SEARCH_PATH: extensions
      PGRST_DB_SCHEMAS: public
      PGRST_DB_URI: postgresql://authenticator@postgres:5432/${OPENEXPERT_POSTGRES_DB:-openexpert}
      PGRST_JWT_AUD: ${NUXT_DATA_API_JWT_AUDIENCE:-openexpert-data}
      PGRST_JWT_SECRET: ${OPENEXPERT_DATA_API_JWKS:?Run db:local:setup to generate local Ed25519 keys}
      PGRST_LOG_LEVEL: warn
      PGRST_SERVER_PORT: 3000
      PGPASSWORD: ${OPENEXPERT_AUTHENTICATOR_PASSWORD:-openexpert-authenticator-local}
    ports:
      - "127.0.0.1:${OPENEXPERT_POSTGREST_PORT:-55321}:3000"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.2
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${OPENEXPERT_MAILPIT_UI_PORT:-55324}:8025"
      - "127.0.0.1:${OPENEXPERT_MAILPIT_SMTP_PORT:-55325}:1025"
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # The hardened Alpine image runs as uid 100 while Docker creates a fresh
    # named volume owned by root. Running the local-only container as root lets
    # MinIO initialize that volume; all ports remain bound to loopback.
    user: "0:0"
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3004,http://127.0.0.1:3006,http://127.0.0.1:3016,http://localhost:3004,http://localhost:3006,http://localhost:3016
      MINIO_API_CORS_ALLOW_CREDENTIALS_WITH_WILDCARD: "off"
      MINIO_ROOT_PASSWORD: ${OPENEXPERT_MINIO_ROOT_PASSWORD:-openexpert-minio-local-secret}
      MINIO_ROOT_USER: ${OPENEXPERT_MINIO_ROOT_USER:-openexpert}
    ports:
      - "127.0.0.1:${OPENEXPERT_MINIO_API_PORT:-55326}:9000"
      - "127.0.0.1:${OPENEXPERT_MINIO_CONSOLE_PORT:-55327}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_PASSWORD: ${OPENEXPERT_MINIO_ROOT_PASSWORD:-openexpert-minio-local-secret}
      MINIO_ROOT_USER: ${OPENEXPERT_MINIO_ROOT_USER:-openexpert}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing local/openexpert-public
        mc mb --ignore-existing local/openexpert-private
        mc anonymous set download local/openexpert-public
        mc anonymous set none local/openexpert-private
    restart: "no"

  livekit:
    image: livekit/livekit-server:v1.13.1
    profiles:
      - livekit
    command:
      - --dev
      - --bind
      - 0.0.0.0
    ports:
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_HTTP_PORT:-7880}:7880"
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${OPENEXPERT_LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    restart: unless-stopped

volumes:
  postgres-data:
    name: openexpert-local-postgres-data
  minio-data:
    name: openexpert-local-minio-data
