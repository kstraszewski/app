minimumReleaseAgeExclude:
  - eve
  # Transitive dependency pinned by the current official Eve scaffold.
  - crossws
# pnpm 11 currently reports this nested workspace as stale before every script.
# Installs are still locked and verified explicitly through pnpm-lock.yaml.
verifyDepsBeforeRun: false
allowBuilds:
  '@mongodb-js/zstd': false
  node-liblzma: false
  sharp: false
# Compatibility for Eve releases with an incomplete runtime manifest.
packageExtensions:
  "eve@>=0.6.0-beta.13 <=0.7.0":
    dependencies:
      oxc-parser: 0.134.0
